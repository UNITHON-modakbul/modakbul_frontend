name: Deploy frontend to S3

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-s3-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_S3_BUCKET: mvpilot.cloud

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SERVICE_PREVIEW_URL: ${{ vars.VITE_SERVICE_PREVIEW_URL }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$AWS_REGION" || (echo "AWS_REGION environment variable is required" && exit 1)
          test -n "${{ secrets.AWS_ROLE_ARN }}" || (echo "AWS_ROLE_ARN environment variable is required" && exit 1)
          test -n "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" || (echo "CLOUDFRONT_DISTRIBUTION_ID environment variable is required" && exit 1)

      - name: Debug OIDC subject
        shell: bash
        run: |
          TOKEN_JSON=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{sub, aud}'

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: mvpilot-${{ github.run_id }}

      - name: Upload build to S3
        shell: bash
        run: |
          aws s3 sync dist/ "s3://$AWS_S3_BUCKET" \
            --delete \
            --only-show-errors \
            --cache-control "no-store,no-cache,max-age=0,must-revalidate"

          aws s3 cp dist/index.html "s3://$AWS_S3_BUCKET/index.html" \
            --only-show-errors \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store,no-cache,max-age=0,must-revalidate"

          if test -f dist/service-preview.html; then
            aws s3 cp dist/service-preview.html "s3://$AWS_S3_BUCKET/service-preview.html" \
              --only-show-errors \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-store,no-cache,max-age=0,must-revalidate"
          fi

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"

      - name: Write deployment summary
        shell: bash
        run: |
          echo "## S3 deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bucket: \`s3://$AWS_S3_BUCKET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CloudFront cache invalidation requested" >> "$GITHUB_STEP_SUMMARY"
          if test -n "${{ vars.SITE_URL }}"; then
            echo "- Site: ${{ vars.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
          fi
