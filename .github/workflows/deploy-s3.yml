name: Deploy frontend to S3

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-s3-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_S3_BUCKET: mvpilot.cloud

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SERVICE_PREVIEW_URL: ${{ vars.VITE_SERVICE_PREVIEW_URL }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$AWS_REGION" || (echo "AWS_REGION environment variable is required" && exit 1)
          test -n "${{ vars.AWS_ROLE_ARN }}" || (echo "AWS_ROLE_ARN environment variable is required" && exit 1)

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: DemoForge-${{ github.run_id }}

      - name: Upload build to S3
        shell: bash
        run: |
          aws s3 sync dist/ "s3://$AWS_S3_BUCKET" \
            --delete \
            --only-show-errors \
            --cache-control "no-cache,no-store,must-revalidate"

          aws s3 cp dist/index.html "s3://$AWS_S3_BUCKET/index.html" \
            --only-show-errors \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

          if test -f dist/service-preview.html; then
            aws s3 cp dist/service-preview.html "s3://$AWS_S3_BUCKET/service-preview.html" \
              --only-show-errors \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache,no-store,must-revalidate"
          fi

      - name: Write deployment summary
        shell: bash
        run: |
          echo "## S3 deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bucket: \`s3://$AWS_S3_BUCKET\`" >> "$GITHUB_STEP_SUMMARY"
          if test -n "${{ vars.SITE_URL }}"; then
            echo "- Site: ${{ vars.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
          fi
