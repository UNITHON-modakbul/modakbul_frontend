<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DemoForge 서비스 미리보기</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #fffaf1;
        color: #17332f;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 76px;
        padding: 0 7%;
        border-bottom: 1px solid rgba(23, 51, 47, 0.12);
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; }
      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 12px;
        background: #17332f;
        color: #d9ef7d;
        font-weight: 900;
      }
      nav { display: flex; gap: 30px; color: rgba(23, 51, 47, 0.58); font-size: 13px; font-weight: 800; }
      main {
        display: grid;
        min-height: calc(100vh - 76px);
        grid-template-columns: 1.05fr 0.95fr;
        align-items: center;
        gap: 5%;
        padding: 7%;
        overflow: hidden;
      }
      .eyebrow { color: #ec6b42; font-size: 12px; font-weight: 900; letter-spacing: 0.14em; }
      h1 { margin: 14px 0 18px; font-size: clamp(42px, 6vw, 82px); line-height: 0.98; letter-spacing: -0.065em; }
      h1 span { color: #ec6b42; }
      p { max-width: 590px; margin: 0; color: rgba(23, 51, 47, 0.58); font-size: clamp(14px, 1.5vw, 18px); line-height: 1.75; }
      button {
        margin-top: 30px;
        border: 0;
        border-radius: 14px;
        background: #17332f;
        color: white;
        padding: 17px 25px;
        font-size: 15px;
        font-weight: 900;
        box-shadow: 0 7px 0 #0d2421;
      }
      .visual { position: relative; min-height: 390px; }
      .blob { position: absolute; inset: 2% -12% -8% 2%; border-radius: 47% 53% 42% 58%; background: #d9ef7d; }
      .card {
        position: absolute;
        inset: 13% 3% 8% 1%;
        transform: rotate(2deg);
        border: 4px solid #17332f;
        border-radius: 34px;
        background: white;
        padding: 10%;
        box-shadow: 18px 18px 0 #ec6b42;
      }
      .pill { display: inline-block; border-radius: 999px; background: #e9f2cc; padding: 8px 14px; font-size: 11px; font-weight: 900; }
      .line { height: 10px; margin-top: 28px; border-radius: 999px; background: #17332f; }
      .line.short { width: 72%; margin-top: 12px; background: rgba(23, 51, 47, 0.18); }
      .blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 34px; }
      .block { height: 100px; border-radius: 17px; background: #f3f0e7; }
      .block:last-child { background: #17332f; }
      @media (max-width: 720px) {
        nav { display: none; }
        main { grid-template-columns: 1fr; padding-top: 12%; }
        .visual { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark">D</span>DemoForge</div>
      <nav><span>서비스 소개</span><span>만드는 과정</span><span>FAQ</span></nav>
    </header>
    <main>
      <section>
        <div class="eyebrow">FROM IDEA TO LIVE PRODUCT</div>
        <h1>아이디어를<br /><span>작동하는 데모로</span></h1>
        <p>기획서를 올리면 AI가 필요한 질문을 찾고, 답변을 바탕으로 실제 동작하는 서비스를 완성해요.</p>
        <button type="button">데모 만들기 →</button>
      </section>
      <section class="visual" aria-hidden="true">
        <div class="blob"></div>
        <div class="card">
          <span class="pill">AI BUILD</span>
          <div class="line"></div>
          <div class="line short"></div>
          <div class="blocks"><div class="block"></div><div class="block"></div></div>
        </div>
      </section>
    </main>
  </body>
</html>
